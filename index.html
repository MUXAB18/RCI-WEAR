  <body>
    <!-- Loading skeleton - shown until React renders -->
    <style>
      #app-skeleton {
        position: fixed;
        inset: 0;
        background: #B0AFAB;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0;
        overflow: hidden;
      }
      
      #app-skeleton::before {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at center, transparent 30%, rgba(0,0,0,0.06) 100%);
        pointer-events: none;
      }

      .skeleton-logo {
        width: 88px;
        height: 88px;
        border-radius: 50%;
        object-fit: cover;
        opacity: 0;
        transform: scale(0.9) translateY(10px);
        animation: skel-logo-reveal 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
        box-shadow: 0 12px 32px rgba(0,0,0,0.12);
        margin-bottom: 24px;
        position: relative;
        z-index: 1;
      }
      
      .skeleton-brand-wrap {
        overflow: hidden;
        margin-bottom: 32px;
        padding: 4px;
        position: relative;
        z-index: 1;
      }

      .skeleton-brand {
        font-family: 'Playfair Display', 'Georgia', serif;
        font-size: 1.1rem;
        font-weight: 400;
        letter-spacing: 0.1em;
        color: #000000;
        text-transform: uppercase;
        transform: translateY(100%);
        opacity: 0;
        animation: skel-text-reveal 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards;
        text-align: center;
      }
      
      .skeleton-brand em {
        font-style: italic;
        color: rgba(0,0,0,0.6);
      }

      .skeleton-progress {
        width: 160px;
        height: 1px;
        background: rgba(0,0,0,0.1);
        position: relative;
        overflow: hidden;
        opacity: 0;
        animation: skel-fade 0.5s ease 0.6s forwards;
        z-index: 1;
      }
      
      .skeleton-progress-bar {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 100%;
        background: #000000;
        transform: scaleX(0);
        transform-origin: left;
        animation: skel-fill 1.3s cubic-bezier(0.65, 0, 0.35, 1) 0.5s forwards;
      }

      @keyframes skel-logo-reveal {
        0% { opacity: 0; transform: scale(0.9) translateY(15px); filter: blur(4px); }
        100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
      }

      @keyframes skel-text-reveal {
        0% { transform: translateY(100%); opacity: 0; }
        100% { transform: translateY(0); opacity: 1; }
      }

      @keyframes skel-fade {
        to { opacity: 1; }
      }

      @keyframes skel-fill {
        0% { transform: scaleX(0); }
        100% { transform: scaleX(1); }
      }

      @keyframes fadeOut {
        to { opacity: 0; pointer-events: none; filter: blur(8px); transform: scale(1.03); }
      }
    </style>
    
    <!-- Skeleton shown while React loads -->
    <div id="app-skeleton">
      <img
        src="/logo.jpg"
        alt="Rasheed Clothing International"
        class="skeleton-logo"
      />
      <div class="skeleton-brand-wrap">
        <div class="skeleton-brand">Rasheed Clothing <em>International</em></div>
      </div>
      <div class="skeleton-progress">
        <div class="skeleton-progress-bar"></div>
      </div>
    </div>
