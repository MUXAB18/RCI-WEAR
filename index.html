    <!-- Preconnect only for fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!--
      LCP-CRITICAL: Preload hero logo so it paints as fast as possible.
      fetchpriority="high" ensures the browser fetches this before other images.
    -->
    <link
      rel="preload"
      as="image"
      href="/logo.webp"
      fetchpriority="high"
    />

    <!--
      Non-blocking font loading:
      media="print" + onload trick loads fonts after page paint.
      The <noscript> fallback handles JS-disabled browsers.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap"
      />
    </noscript>

    <!-- Google Analytics — defer so it never blocks render -->
    <script defer src="https://www.googletagmanager.com/gtag/js?id=G-JZHHWJ6J4G"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-JZHHWJ6J4G');
    </script>

    <!-- Google AdSense — load after page is interactive to avoid blocking -->
    <script>
      // Defer AdSense until after first user interaction or 3s, whichever comes first
      (function() {
        var loaded = false;
        function loadAds() {
          if (loaded) return;
          loaded = true;
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4371702225315385';
          s.crossOrigin = 'anonymous';
          document.head.appendChild(s);
        }
        // Load on first interaction
        ['touchstart', 'click', 'scroll', 'keydown'].forEach(function(e) {
          document.addEventListener(e, loadAds, { once: true, passive: true });
        });
        // Or load after 3 seconds regardless
        setTimeout(loadAds, 3000);
      })();
    </script>

    <!--
      CRITICAL CSS — inlined so the page has styles before any JS runs.
      This covers the above-the-fold hero so LCP paints immediately.
    -->
    <style>
      /* ── Reset ── */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      /* ── Design tokens (subset needed above-fold) ── */
      :root {
        --near-black: #0B0B0B;
        --hero-bg: #B0AFAB;
        --font-serif: 'Playfair Display', Georgia, serif;
        --font-sans: 'Inter', -apple-system, sans-serif;
        --ease-luxury: cubic-bezier(0.16, 1, 0.3, 1);
      }

      html, body { height: 100%; }

      body {
        background: var(--hero-bg);
        color: var(--near-black);
        font-family: var(--font-sans);
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }

      #root { min-height: 100vh; }

      /*
        THIN loading bar at top — replaces the full-screen skeleton.
        This is visible but non-blocking. Lighthouse CAN see content behind it.
      */
      #page-loader {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
        background: rgba(11,11,11,0.08);
        z-index: 99999;
        pointer-events: none;
      }
      #page-loader-bar {
        height: 100%;
        background: var(--near-black);
        width: 0%;
        transition: width 0.4s ease;
        animation: loader-progress 1.8s var(--ease-luxury) forwards;
      }
      @keyframes loader-progress {
        0%   { width: 0%; }
        40%  { width: 60%; }
        70%  { width: 80%; }
        100% { width: 100%; }
      }

      /* Hero section immediate visibility — LCP element must be visible ASAP */
      #home {
        position: relative;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        overflow: hidden;
        background: #B0AFAB;
      }

      /* Hero title — immediately visible, no opacity:0 on initial paint */
      .hero-title-lcp {
        font-family: var(--font-serif);
        font-size: clamp(2.4rem, 8vw, 7rem);
        font-weight: 700;
        line-height: 1.05;
        letter-spacing: -0.02em;
        color: var(--near-black);
      }

      /* Fade-in animation for skeleton removal */
      @keyframes fadeOut {
        to { opacity: 0; pointer-events: none; }
      }
    </style>
  </head>
  <body>
    <!-- Thin progress bar at top (non-blocking) -->
    <div id="page-loader" aria-hidden="true">
      <div id="page-loader-bar"></div>
    </div>

    <div id="root">
      <!-- 
        STATIC HERO SKELETON:
        This paints instantly (~0.5s) while React JS is downloading (which takes ~3.9s on Slow 4G).
        This fixes the massive 3.9s FCP delay. When React mounts, it replaces this div.
      -->
      <section id="home" style="position: relative; min-height: 100vh; display: flex; align-items: center; overflow: hidden; background: #B0AFAB; padding: 24px;">
        <div style="max-width: 1360px; margin: 0 auto; width: 100%; position: relative; z-index: 10;">
          <h1 class="hero-title-lcp" style="margin-bottom: 24px;">
            <span style="display: block;">Rasheed Clothing</span>
            <span style="display: block;">International</span>
          </h1>
          <p style="font-family: var(--font-sans); font-size: 11px; letter-spacing: 2px; text-transform: uppercase; font-weight: 600; margin-bottom: 24px;">
            Est. Premium Collections · Since 2017
          </p>
          <p style="font-family: var(--font-serif); font-size: 1.5rem; font-style: italic; margin-bottom: 16px;">
            Where Imagination Meets Fabrication
          </p>
        </div>
      </section>
    </div>

    <script type="module" src="/src/main.jsx"></script>

    <!-- Hide loader bar once React mounts -->
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        var loader = document.getElementById('page-loader');
        if (loader) {
          setTimeout(function() {
            loader.style.animation = 'fadeOut 0.5s ease forwards';
            setTimeout(function() { loader.remove(); }, 600);
          }, 1800);
        }
      });
    </script>
  </body>
</html>
